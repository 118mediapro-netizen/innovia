<div class="screen noscroll" style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 104px 16px 160px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
<div style="display: flex; flex-direction: column; min-width: 0">
<span class="nx-lab">{{g.headLabel}}</span>
<span id="inoAmount" style="{{g.bigStyle}}">{{g.big}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 0 0 auto">
<button class="tap" type="button" onClick="{{g.openWorld}}" style="height: 40px; padding: 0 12px; border: none; border-radius: 20px; font-family: inherit; font-weight: 800; color: #260E4F; cursor: pointer; background: #EBE4F6; display: flex; align-items: center; gap: 6px; font-size: 13px; flex: 0 0 auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#260E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l5-3v14M10 21V4l9 4v13"></path><path d="M13 11h3M13 15h3"></path></svg>Mon monde</button>
<sc-if value="{{g.showBourse}}" hint-placeholder-val="{{ false }}"><button class="tap nx-mini" type="button" onClick="{{g.openBourse}}">Bourse · {{g.bourse}}</button></sc-if>
<sc-if value="{{g.showRich}}" hint-placeholder-val="{{ false }}"><button class="tap nx-rich" type="button" onClick="{{g.openRich}}">Classement</button></sc-if>
</div>
</div>
<div class="nx-wallet"><span class="nx-wl">Ton argent</span><b class="{{g.moneyCls}}">{{g.money}}</b><small class="{{g.rateCls}}">{{g.headSub}}</small></div>
<div class="nx-price {{g.priceCls}}"><span class="nx-pl"><b>{{g.priceLab}}</b><small>{{g.priceSub}}</small></span><span class="nx-pv">{{g.priceV}}</span><sc-if value="{{g.pricePm}}" hint-placeholder-val="{{ true }}"><span class="nx-pm"><button class="tap" type="button" onClick="{{g.priceMinus}}" aria-label="Baisser le prix">−</button><button class="tap" type="button" onClick="{{g.pricePlus}}" aria-label="Monter le prix">+</button></span></sc-if></div>
<div class="ino-strip"><sc-for list="{{g.tiles}}" as="tl" hint-placeholder-count="3"><button class="tap {{tl.cls}}" type="button" onClick="{{tl.open}}"><small>{{tl.t}}</small><b>{{tl.sub}}</b></button></sc-for></div>
<div class="nx-tv"><div class="nx-journal" aria-live="polite"><sc-for list="{{g.log}}" as="jl" hint-placeholder-count="3"><div class="{{jl.cls}}"><span>{{jl.t}}</span></div></sc-for></div></div>

<div style="margin-top: 10px; position: relative">
<button class="tap hqbtn" type="button" onClick="{{g.tap}}" aria-label="{{g.tapAria}}" style="position: relative; display: block; width: 100%; height: 290px; padding: 0; border: none; border-radius: 28px; overflow: hidden; cursor: pointer; background: #F2EEFA; touch-action: manipulation; font-family: inherit">
<canvas id="inoPlanet" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none"></canvas>
<sc-if value="{{g.showHint}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; top: 58px; z-index: 2; padding: 8px 14px; border-radius: 16px; background: #7046DC; color: #FFFFFF; font-size: 14px; font-weight: 800; white-space: nowrap; pointer-events: none; animation: hintBob 1.2s ease-in-out infinite">Touche la planète</span></sc-if>
<span class="nx-clic {{g.clicCls}}" style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 2; padding: 7px 16px; border-radius: 16px; background: #260E4F; color: #FFFFFF; font-size: 15px; font-weight: 800; white-space: nowrap; pointer-events: none">{{g.clicLabel}}</span>
</button>
</div>
<div class="ino-strip"><sc-for list="{{g.tiles2}}" as="tl" hint-placeholder-count="2"><button class="tap {{tl.cls}}" type="button" onClick="{{tl.open}}"><small>{{tl.t}}</small><b>{{tl.sub}}</b></button></sc-for></div>
<div style="margin-top: 10px; display: flex; justify-content: center"><span class="nx-pill {{g.pillCls}}">{{g.phasePill}}</span></div>
<div style="margin-top: 10px; display: flex; align-items: center; gap: 6px">
<sc-for list="{{g.steps}}" as="sp" hint-placeholder-count="4">
<span style="display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 0 0 58px"><span class="stg" style="{{sp.style}}"><img src="{{sp.img}}" alt="" draggable="false" style="width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none"></span><span style="{{sp.labStyle}}">{{sp.lab}}</span></span>
<sc-if value="{{sp.hasBar}}" hint-placeholder-val="{{ true }}"><span style="flex: 1; height: 6px; border-radius: 3px; background: #EBE4F6; overflow: hidden"><span class="barfx" style="{{sp.bar}}"></span></span></sc-if>
</sc-for>
</div>
<div style="margin-top: 6px; font-size: 12px; font-weight: 800; color: #6C5A8C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.lvlLine}}</div>



<span class="nx-split"></span>
<sc-for list="{{g.cards}}" as="cd" hint-placeholder-count="1"><div class="nx-card">
<div class="nx-ch"><span>{{cd.title}}</span><sc-if value="{{cd.hasInfo}}" hint-placeholder-val="{{ false }}"><button class="tap nx-i" type="button" onClick="{{cd.info}}" aria-label="Explication">i</button></sc-if></div>
<sc-for list="{{cd.rows}}" as="r" hint-placeholder-count="2"><div class="{{r.cls}}">
<span class="nx-rt"><b>{{r.t}}</b><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ true }}"><small>{{r.sub}}</small></sc-if></span>
<sc-if value="{{r.hasV}}" hint-placeholder-val="{{ true }}"><span class="nx-v {{r.vcls}}">{{r.v}}</span></sc-if>
<sc-if value="{{r.hasPm}}" hint-placeholder-val="{{ false }}"><span class="nx-pm"><button class="tap" type="button" onClick="{{r.minus}}" aria-label="Baisser le prix">−</button><button class="tap" type="button" onClick="{{r.plus}}" aria-label="Monter le prix">+</button></span></sc-if>
<sc-if value="{{r.hasBtn}}" hint-placeholder-val="{{ true }}"><button class="tap nx-b {{r.bcls}}" type="button" onClick="{{r.act}}">{{r.b}}</button></sc-if>
</div></sc-for>
</div></sc-for>
<span class="nx-end-col"></span>
</div>
