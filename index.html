<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;600;700;800&amp;family=Sora:wght@400;600;700;800&amp;family=Outfit:wght@400;600;700;800&amp;family=Urbanist:wght@400;600;700;800&amp;family=DM+Sans:wght@400;600;700;800&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Poppins:wght@400;600;700;800&amp;family=Lexend:wght@400;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Figtree:wght@400;600;700;800&amp;family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Unbounded:wght@400;600;700;800&amp;family=Syne:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E3A57}a:hover{color:#0E3A57}
@keyframes inUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(91,184,245,.6)}100%{box-shadow:0 0 0 18px rgba(91,184,245,0)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.18)}100%{transform:scale(1.1)}}
.screen{animation:inUp .4s cubic-bezier(.2,.8,.2,1) both}
.card{animation:inUp .5s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fadeIn .25s ease both}
.sheet{animation:sheetUp .38s cubic-bezier(.2,.8,.2,1) both}
.drawer{animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.95)}
.orb{animation:floaty 4s ease-in-out infinite, glow 2.4s ease-out infinite}
.bob1{animation:bob 3s ease-in-out infinite}
.bob2{animation:bob 3s ease-in-out .4s infinite}
.bob3{animation:bob 3s ease-in-out .8s infinite}
.on{animation:pop .35s cubic-bezier(.2,.8,.2,1) both, glow 2s ease-out .35s infinite}
.pulse{animation:glow 2s ease-out infinite}
.noscroll::-webkit-scrollbar{display:none}
@keyframes popUpB{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.popup.pB{animation-name:popUpB}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.popup{position:absolute;top:96px;z-index:2;animation:popUp .7s ease-out forwards;pointer-events:none;font-size:22px;text-shadow:0 2px 0 #FFFFFF;font-weight:800;color:#0E3A57;white-space:nowrap}
@keyframes spinR{to{transform:rotate(360deg)}}
.spin{animation:spinR 14s linear infinite}
@keyframes ringOutB{from{transform:translate(-50%,-50%) scale(1);opacity:.6}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.ring.rB{animation-name:ringOutB}
@keyframes ringOut{from{transform:translate(-50%,-50%) scale(1);opacity:.6}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.ring{position:absolute;left:50%;top:50%;width:200px;height:200px;border-radius:100px;border:4px solid #5BB8F5;box-sizing:border-box;pointer-events:none;animation:ringOut .6s ease-out forwards}
@keyframes sparkOutB{from{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.spark.sB{animation-name:sparkOutB}
@keyframes sparkOut{from{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.spark{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:6px;pointer-events:none;animation:sparkOut .55s ease-out forwards}
.tapcore{transition:transform .08s ease}
.tapcore:active{transform:scale(.9)}
@keyframes comboPop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
.combo{animation:comboPop .5s ease-in-out infinite}
@keyframes spinA{to{transform:rotate(360deg)}}
.authsheet > *{flex-shrink:0}
@keyframes whintA{0%,70%{opacity:1}100%{opacity:0}}
.whint{animation:whintA 5s ease forwards}
.spinner{width:20px;height:20px;border-radius:10px;border:3px solid #CFE8FA;border-top-color:#5BB8F5;animation:spinA .8s linear infinite}
@keyframes shineA{0%,100%{box-shadow:0 0 0 0 rgba(91,184,245,.0)}50%{box-shadow:0 0 0 6px rgba(91,184,245,.25)}}
.missionb{animation:shineA 2.4s ease-in-out infinite}
.hqbtn{transition:transform .08s ease}
.hqbtn:active{transform:scale(.97)}
.hqpop{transition:transform .08s ease}
.hqbtn:active .hqpop{transform:scale(.92,.88)}
@keyframes droneFloat{0%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}100%{transform:translate(-10px,6px)}}
.drone{position:absolute;pointer-events:none;animation:droneFloat 3.2s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.cloud1{animation:drift 9s ease-in-out infinite alternate}
.cloud2{animation:drift 12s ease-in-out infinite alternate-reverse}
@keyframes driveR{from{transform:translateX(0)}to{transform:translateX(460px)}}
@keyframes driveL{from{transform:translateX(0)}to{transform:translateX(-470px)}}
.car{animation:driveR 7s linear infinite}
.car2{animation:driveL 9s linear infinite}
@keyframes blinkA{0%,100%{opacity:1}50%{opacity:.2}}
.blink{animation:blinkA 1.4s ease-in-out infinite}
@keyframes pringA{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.pring{animation:blinkA 1.6s ease-in-out infinite}
@keyframes redA{0%,100%{opacity:.55}50%{opacity:1}}
.redfx{pointer-events:none;animation:redA 1.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(30px) scaleY(.4);opacity:0}to{transform:none;opacity:1}}
.bld{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom center}
</style>

<style>
html, body { height: 100%; background: #FFFFFF; color: #0E3A57; overflow: hidden; overscroll-behavior: none }
#stage { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); background: #FFFFFF; overflow: hidden }
#app { position: absolute; top: 0; width: 390px; height: 844px; transform-origin: 0 0; overflow: hidden }
#root, #root > div { height: 100% }
#app, #app * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none }
#app canvas#inoWorld { touch-action: none }
.in-app #stage { top: 0 !important; bottom: 0 !important }
#app input, #app textarea { -webkit-user-select: auto; user-select: auto }
</style>
<script>try { if (window.ReactNativeWebView) document.documentElement.classList.add('in-app'); } catch (e) {}</script>
<div id="stage"><div id="app"><div id="root"></div></div></div>
<template id="tpl">
<div style="width: 390px; height: 100%; position: relative; overflow: hidden; background: #FFFFFF; font-family: {{fontFamily}}; color: #0E3A57">

<sc-if value="{{showIntro}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: #000000; overflow: hidden">
<canvas id="inoGL" width="780" height="1688" style="position: absolute; left: 0; top: 50%; margin-top: -422px; width: 390px; height: 844px; display: block"></canvas>
<canvas id="inoFX" width="780" height="1688" style="position: absolute; left: 0; top: 50%; margin-top: -422px; width: 390px; height: 844px; pointer-events: none"></canvas>
<div id="inoLoad" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 13px; letter-spacing: 0.06em">Chargement…</div>
<div id="inoLogo" style="position: absolute; inset: 0; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; opacity: 0; pointer-events: none">
<svg id="inoStar" width="92" height="92" viewBox="0 0 24 24" fill="#5BB8F5" aria-hidden="true"><path d="M12 2l2.3 6.4L21 10.5l-6.7 2.1L12 19l-2.3-6.4L3 10.5l6.7-2.1z"></path><circle cx="19" cy="4.5" r="1.6"></circle></svg>
<span id="inoName" style="font-size: 46px; font-weight: 800; color: #0E3A57; letter-spacing: -0.02em">Inovia</span>
</div>
<button class="tap" type="button" onClick="{{skipIntro}}" style="position: absolute; top: 54px; right: 20px; height: 40px; padding: 0 16px; border: none; border-radius: 20px; background: rgba(255,255,255,0.16); color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Passer</button>
</div>
</sc-if>

<sc-if value="{{showOnb}}" hint-placeholder-val="{{ true }}">
<div class="screen" style="height: 100%; box-sizing: border-box; padding: 110px 28px 44px; display: flex; flex-direction: column; align-items: center; text-align: center">
<button class="tap" type="button" onClick="{{openFonts}}" style="position: absolute; top: 54px; right: 20px; height: 44px; padding: 0 16px; border: none; border-radius: 22px; background: #E3F2FD; display: flex; align-items: center; gap: 8px; color: #0E3A57; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer"><span style="font-size: 17px">Aa</span>Tester les polices</button>
<div class="orb" style="width: 120px; height: 120px; border-radius: 60px; background: #5BB8F5; display: flex; align-items: center; justify-content: center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l2.3 6.4L21 10.5l-6.7 2.1L12 19l-2.3-6.4L3 10.5l6.7-2.1z"></path><circle cx="19" cy="4.5" r="1.6"></circle></svg>
</div>
<h1 style="margin: 32px 0 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em">Inovia</h1>
<p style="margin: 14px 0 0; font-size: 24px; font-weight: 700; line-height: 1.25">L’IA, c’est ton avenir.<br>Apprends-la dès aujourd’hui.</p>
<p style="margin: 12px 0 0; font-size: 15px; color: #4F7590; line-height: 1.5">Réponds à quelques questions : l’IA trouve ton niveau et règle ton fil pour toi.</p>
<div style="flex: 1"></div>
<button class="tap" type="button" onClick="{{startQuiz}}" style="width: 100%; height: 58px; border: none; border-radius: 29px; background: #5BB8F5; color: #0E3A57; font-family: inherit;font-size: 17px; font-weight: 800; cursor: pointer">Trouver mon niveau</button>
<button class="tap" type="button" onClick="{{goActu}}" style="margin-top: 10px; height: 48px; padding: 0 20px; border: none; background: none; color: #4F7590; font-family: inherit;font-size: 15px; font-weight: 700; cursor: pointer">Plus tard</button>
</div>
</sc-if>

<sc-if value="{{showActu}}" hint-placeholder-val="{{ false }}">
<div class="screen noscroll" style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 108px 16px 150px">
<div style="position: relative; margin-bottom: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F7590" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px; pointer-events: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="newsSearch" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" aria-label="Rechercher une actu" placeholder="Rechercher une actu, un sujet, un média" value="{{q}}" onInput="{{setQ}}" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 48px 0 46px; border: 1.5px solid #CFE8FA; border-radius: 25px; background: #F5FAFE; font-family: inherit; font-size: 16px; font-weight: 600; color: #0E3A57; outline: none; -webkit-appearance: none; appearance: none">
<sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button class="tap" type="button" onClick="{{clearQ}}" aria-label="Effacer la recherche" style="position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border: none; border-radius: 17px; background: #E3F2FD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E3A57" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
</div>
<div class="noscroll" style="margin: 0 -16px; padding: 0 16px; display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="5">
<button class="tap" type="button" onClick="{{th.pick}}" style="{{th.style}}">{{th.name}}</button>
</sc-for>
</div>
<sc-if value="{{noNews}}" hint-placeholder-val="{{ false }}">
<div class="card" style="margin-top: 20px; padding: 28px 20px; border-radius: 26px; background: #E3F2FD; text-align: center">
<p style="margin: 0; font-size: 16px; font-weight: 700">{{noNewsText}}</p>
</div>
</sc-if>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{news}}" as="n" hint-placeholder-count="3">
<button class="tap card" type="button" onClick="{{n.open}}" style="{{n.cardStyle}}">
<span style="display: block; height: 230px; overflow: hidden">
<sc-if value="{{n.hasPhoto}}" hint-placeholder-val="{{ false }}">
<img src="{{n.photo}}" alt="" style="width: 100%; height: 230px; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{n.ca}}" hint-placeholder-val="{{ true }}">
<svg width="358" height="230" viewBox="0 0 350 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="350" height="230" fill="#5BB8F5"></rect><circle cx="300" cy="30" r="70" fill="#FFFFFF" opacity="0.18"></circle><g transform="rotate(-10 125 125)"><rect x="70" y="60" width="110" height="130" rx="14" fill="#FFFFFF"></rect><rect x="82" y="72" width="86" height="80" rx="8" fill="#E3F2FD"></rect><path d="M86 150l26-30 20 22 14-14 22 22z" fill="#5BB8F5"></path><circle cx="148" cy="94" r="9" fill="#5BB8F5"></circle></g><path d="M192 118h36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path><path d="M220 104l14 14-14 14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="248" y="50" width="74" height="134" rx="16" fill="#0E3A57"></rect><rect x="254" y="58" width="62" height="118" rx="11" fill="#FFFFFF"></rect><circle cx="285" cy="117" r="18" fill="#5BB8F5"></circle><path d="M279 107l16 10-16 10z" fill="#FFFFFF"></path></svg>
</sc-if>
<sc-if value="{{n.cb}}" hint-placeholder-val="{{ false }}">
<svg width="358" height="230" viewBox="0 0 350 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="350" height="230" fill="#E3F2FD"></rect><circle cx="175" cy="125" r="92" fill="#FFFFFF"></circle><rect x="115" y="95" width="120" height="86" rx="14" fill="#5BB8F5"></rect><path d="M150 95V81a8 8 0 0 1 8-8h34a8 8 0 0 1 8 8v14" fill="none" stroke="#0E3A57" stroke-width="7"></path><rect x="115" y="126" width="120" height="8" fill="#0E3A57" opacity="0.25"></rect><path d="M262 52l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#5BB8F5"></path><path d="M78 52l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#0E3A57"></path></svg>
</sc-if>
<sc-if value="{{n.cc}}" hint-placeholder-val="{{ false }}">
<svg width="358" height="230" viewBox="0 0 350 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="350" height="230" fill="#5BB8F5"></rect><circle cx="60" cy="200" r="90" fill="#FFFFFF" opacity="0.18"></circle><circle cx="290" cy="50" r="4" fill="#FFFFFF"></circle><circle cx="250" cy="30" r="3" fill="#FFFFFF"></circle><circle cx="300" cy="120" r="3" fill="#FFFFFF"></circle><circle cx="70" cy="50" r="4" fill="#FFFFFF"></circle><g transform="rotate(40 175 115)"><path d="M175 36c26 20 34 58 26 98h-52c-8-40 0-78 26-98z" fill="#FFFFFF"></path><circle cx="175" cy="86" r="13" fill="#5BB8F5"></circle><path d="M149 118l-20 26h26zM201 118l20 26h-26z" fill="#0E3A57"></path><path d="M162 138h26l-13 32z" fill="#E3F2FD"></path></g></svg>
</sc-if>
<sc-if value="{{n.cd}}" hint-placeholder-val="{{ false }}">
<svg width="358" height="230" viewBox="0 0 350 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="350" height="230" fill="#E3F2FD"></rect><rect x="70" y="45" width="210" height="145" rx="16" fill="#FFFFFF"></rect><path d="M86 45h178a16 16 0 0 1 16 16v14H70V61a16 16 0 0 1 16-16z" fill="#5BB8F5"></path><circle cx="90" cy="60" r="5" fill="#FFFFFF"></circle><circle cx="106" cy="60" r="5" fill="#FFFFFF"></circle><circle cx="122" cy="60" r="5" fill="#FFFFFF"></circle><path d="M140 106l-24 24 24 24M210 106l24 24-24 24" fill="none" stroke="#5BB8F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path><path d="M185 100l-20 60" stroke="#0E3A57" stroke-width="8" stroke-linecap="round"></path></svg>
</sc-if>
<sc-if value="{{n.cf}}" hint-placeholder-val="{{ false }}">
<svg width="358" height="230" viewBox="0 0 350 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="350" height="230" fill="#5BB8F5"></rect><circle cx="290" cy="40" r="80" fill="#FFFFFF" opacity="0.16"></circle><circle cx="40" cy="210" r="60" fill="#FFFFFF" opacity="0.12"></circle><rect x="58" y="52" width="170" height="54" rx="22" fill="#FFFFFF"></rect><path d="M84 106l-8 18 26-18z" fill="#FFFFFF"></path><rect x="78" y="70" width="96" height="8" rx="4" fill="#CFE8FA"></rect><rect x="78" y="84" width="64" height="8" rx="4" fill="#CFE8FA"></rect><rect x="120" y="122" width="176" height="64" rx="24" fill="#0E3A57"></rect><path d="M270 186l10 18-30-18z" fill="#0E3A57"></path><text x="208" y="163" text-anchor="middle" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">GPT-6</text><path d="M300 92l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#FFFFFF"></path><path d="M44 140l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#FFFFFF" opacity="0.8"></path></svg>
</sc-if>
<sc-if value="{{n.ce}}" hint-placeholder-val="{{ false }}">
<svg width="358" height="230" viewBox="0 0 350 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="350" height="230" fill="#5BB8F5"></rect><rect x="85" y="38" width="180" height="154" rx="16" fill="#FFFFFF"></rect><rect x="100" y="53" width="150" height="104" rx="10" fill="#E3F2FD"></rect><circle cx="212" cy="84" r="14" fill="#5BB8F5"></circle><path d="M100 147l45-52 30 34 20-20 55 45v3a10 10 0 0 1-10 10H110a10 10 0 0 1-10-10z" fill="#5BB8F5"></path><rect x="120" y="168" width="110" height="8" rx="4" fill="#E3F2FD"></rect><path d="M298 40l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#FFFFFF"></path></svg>
</sc-if>
</span>
<span style="display: block; padding: 16px 18px 18px">
<span style="display: block; font-size: 23px; font-weight: 800; line-height: 1.2; letter-spacing: -0.015em; color: #0E3A57">{{n.title}}</span>
<span style="display: block; margin-top: 10px; font-size: 13px; font-weight: 700; color: #4F7590">{{n.tag}} · {{n.source}} · 1 min</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{showForm}}" hint-placeholder-val="{{ false }}">
<div class="screen noscroll" style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 112px 20px 150px">
<h2 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Formations</h2>
<p style="margin: 4px 0 0; font-size: 14px; color: #4F7590">Achète une fois, garde-la à vie.</p>
<div class="card" style="margin-top: 20px; padding: 22px; border-radius: 26px; background: #5BB8F5">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Recommandée pour toi</span>
<h3 style="margin: 8px 0 0; font-size: 24px; font-weight: 800">Les bases de l’IA</h3>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5">Comprendre et utiliser l’IA au quotidien, sans aucune connaissance.</p>
<div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 20px; font-weight: 800">9,99 €</span>
<button class="tap" type="button" onClick="{{buzzOnly}}" style="height: 46px; padding: 0 20px; border: none; border-radius: 23px; background: #FFFFFF; color: #0E3A57; font-family: inherit;font-size: 15px; font-weight: 800; cursor: pointer">Découvrir</button>
</div>
</div>
<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{courses}}" as="c" hint-placeholder-count="4">
