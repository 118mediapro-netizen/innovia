<style>
body{margin:0}
a{color:#0E3A57}a:hover{color:#0E3A57}
@keyframes inUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(91,184,245,.6)}100%{box-shadow:0 0 0 18px rgba(91,184,245,0)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.18)}100%{transform:scale(1.1)}}
.screen{animation:inUp .4s cubic-bezier(.2,.8,.2,1) both}
.card{animation:inUp .5s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fadeIn .25s ease both}
.sheet{animation:sheetUp .38s cubic-bezier(.2,.8,.2,1) both}
.drawer{animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.95)}
.orb{animation:floaty 4s ease-in-out infinite, glow 2.4s ease-out infinite}
.bob1{animation:bob 3s ease-in-out infinite}
.bob2{animation:bob 3s ease-in-out .4s infinite}
.bob3{animation:bob 3s ease-in-out .8s infinite}
.on{animation:pop .35s cubic-bezier(.2,.8,.2,1) both, glow 2s ease-out .35s infinite}
.pulse{animation:glow 2s ease-out infinite}
.noscroll::-webkit-scrollbar{display:none}
@keyframes popUpB{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.popup.pB{animation-name:popUpB}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.popup{position:absolute;top:96px;z-index:2;animation:popUp .7s ease-out forwards;pointer-events:none;font-size:22px;text-shadow:0 2px 0 #FFFFFF;font-weight:800;color:#0E3A57;white-space:nowrap}
@keyframes spinR{to{transform:rotate(360deg)}}
.spin{animation:spinR 14s linear infinite}
@keyframes ringOutB{from{transform:translate(-50%,-50%) scale(1);opacity:.6}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.ring.rB{animation-name:ringOutB}
@keyframes ringOut{from{transform:translate(-50%,-50%) scale(1);opacity:.6}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.ring{position:absolute;left:50%;top:50%;width:200px;height:200px;border-radius:100px;border:4px solid #5BB8F5;box-sizing:border-box;pointer-events:none;animation:ringOut .6s ease-out forwards}
@keyframes sparkOutB{from{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.spark.sB{animation-name:sparkOutB}
@keyframes sparkOut{from{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.spark{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:6px;pointer-events:none;animation:sparkOut .55s ease-out forwards}
.tapcore{transition:transform .08s ease}
.tapcore:active{transform:scale(.9)}
@keyframes comboPop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
.combo{animation:comboPop .5s ease-in-out infinite}
@keyframes spinA{to{transform:rotate(360deg)}}
html,body{overscroll-behavior:none}
.screen{overscroll-behavior:contain;overflow-x:hidden;touch-action:pan-y}
.hscroll{touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.authsheet > *{flex-shrink:0}
@keyframes whintA{0%,70%{opacity:1}100%{opacity:0}}
.whint{animation:whintA 5s ease forwards}
.spinner{width:20px;height:20px;border-radius:10px;border:3px solid #CFE8FA;border-top-color:#5BB8F5;animation:spinA .8s linear infinite}
@keyframes shineA{0%,100%{box-shadow:0 0 0 0 rgba(91,184,245,.0)}50%{box-shadow:0 0 0 6px rgba(91,184,245,.25)}}
.missionb{animation:shineA 2.4s ease-in-out infinite}
.hqbtn{transition:transform .08s ease}
@keyframes inboxPulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55),0 8px 22px rgba(14,58,87,.35)}70%{box-shadow:0 0 0 16px rgba(229,72,77,0),0 8px 22px rgba(14,58,87,.35)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0),0 8px 22px rgba(14,58,87,.35)}}
.inboxb{animation:inboxPulse 1.6s ease-out infinite}
@keyframes newGlow{0%{box-shadow:0 0 0 0 rgba(91,184,245,.75)}70%{box-shadow:0 0 0 16px rgba(91,184,245,0)}100%{box-shadow:0 0 0 0 rgba(91,184,245,0)}}
.newf{animation:newGlow 1.3s ease-out 3, inUp .5s ease-out both;border-radius:22px}
@keyframes hintBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.hqbtn:active{transform:scale(.97)}
.hqpop{transition:transform .08s ease}
.hqbtn:active .hqpop{transform:scale(.92,.88)}
@keyframes droneFloat{0%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}100%{transform:translate(-10px,6px)}}
.drone{position:absolute;pointer-events:none;animation:droneFloat 3.2s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.cloud1{animation:drift 9s ease-in-out infinite alternate}
.cloud2{animation:drift 12s ease-in-out infinite alternate-reverse}
@keyframes driveR{from{transform:translateX(0)}to{transform:translateX(460px)}}
@keyframes driveL{from{transform:translateX(0)}to{transform:translateX(-470px)}}
.car{animation:driveR 7s linear infinite}
.car2{animation:driveL 9s linear infinite}
@keyframes blinkA{0%,100%{opacity:1}50%{opacity:.2}}
.blink{animation:blinkA 1.4s ease-in-out infinite}
@keyframes pringA{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.pring{animation:blinkA 1.6s ease-in-out infinite}
@keyframes redA{0%,100%{opacity:.55}50%{opacity:1}}
.redfx{pointer-events:none;animation:redA 1.2s ease-in-out infinite}
@keyframes hackPulse{0%,100%{background:rgba(229,72,77,.78)}50%{background:rgba(180,35,42,.95)}}
@keyframes hackShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes hackBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes rise{from{transform:translateY(30px) scaleY(.4);opacity:0}to{transform:none;opacity:1}}
.bld{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom center}
</style>

<style>
html, body { height: 100%; background: #FFFFFF; color: #0E3A57; overflow: hidden; overscroll-behavior: none }
#stage { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); background: #FFFFFF; overflow: hidden }
#app { position: absolute; top: 0; width: 390px; height: 844px; transform-origin: 0 0; overflow: hidden }
#root, #root > div { height: 100% }
#app, #app * { touch-action: pan-y; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none }
#app canvas#inoWorld { touch-action: none }
#app .hscroll, #app .hscroll * { touch-action: pan-x pan-y }
html, body, #stage, #app { overscroll-behavior: none }
.in-app #stage { top: 0 !important; bottom: 0 !important }
#app .screen { padding-left: max(28px, calc((100% - 680px) / 2)) !important; padding-right: max(28px, calc((100% - 680px) / 2)) !important }
#app .screen.ipwide { padding-left: max(28px, calc((100% - 1000px) / 2)) !important; padding-right: max(28px, calc((100% - 1000px) / 2)) !important }
#app .ipcols { display: flex; gap: 28px; align-items: flex-start }
#app .ipcol { flex: 1 1 0; min-width: 0 }
#app .ipcol > div:first-child { margin-top: 0 !important }
#app .ipnews { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start }
#app .ipnews svg { width: 100% }
#app .ipgrid2 { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) }
#app nav { max-width: 460px; margin: 0 auto }
#app .sheet:not([style*="inset: 0"]) { max-width: 640px; margin-left: auto; margin-right: auto }
#app .sheet.noscroll[style*="inset: 0"] { padding-left: max(18px, calc((100% - 760px) / 2)) !important; padding-right: max(18px, calc((100% - 760px) / 2)) !important }
#app #inoGL, #app #inoFX { left: 50% !important; margin-left: -195px; transform: scale(var(--ks, 1)); transform-origin: 50% 50% }
#app input, #app textarea { -webkit-user-select: auto; user-select: auto }
</style>
<script>try { if (window.ReactNativeWebView) document.documentElement.classList.add('in-app'); } catch (e) {}</script>
<div id="stage"><div id="app"><div id="root"></div></div></div>
<template id="tpl">
<div style="width: 100%; height: 100%; position: relative; overflow: hidden; background: #FFFFFF; font-family: {{fontFamily}}; color: #0E3A57">

<sc-if value="{{showIntro}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: #000000; overflow: hidden">
<canvas id="inoGL" width="780" height="1688" style="position: absolute; left: 0; top: 50%; margin-top: -422px; width: 390px; height: 844px; display: block"></canvas>
<canvas id="inoFX" width="780" height="1688" style="position: absolute; left: 0; top: 50%; margin-top: -422px; width: 390px; height: 844px; pointer-events: none"></canvas>
<div id="inoLoad" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 13px; letter-spacing: 0.06em">Chargement…</div>

<sc-if value="{{showOnb}}" hint-placeholder-val="{{ true }}">

<svg width="56" height="56" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l2.3 6.4L21 10.5l-6.7 2.1L12 19l-2.3-6.4L3 10.5l6.7-2.1z"></path><circle cx="19" cy="4.5" r="1.6"></circle></svg>
</div>
<h1 style="margin: 32px 0 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em">Inovia</h1>
<p style="margin: 14px 0 0; font-size: 24px; font-weight: 700; line-height: 1.25">L’IA, c’est ton avenir.<br>Apprends-la dès aujourd’hui.</p>

<button class="tap" type="button" onClick="{{goActu}}" style="margin-top: 10px; height: 48px; padding: 0 20px; border: none; background: none; color: #4F7590; font-family: inherit;font-size: 15px; font-weight: 700; cursor: pointer">Plus tard</button>
</div>
</sc-if>

<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; color: #4F7590">{{ms.kind}}</span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em">{{ms.client}}</span>
</span>
</div>
<sc-if value="{{ms.showForm}}" hint-placeholder-val="{{ true }}">
<p style="margin: 14px 0 0; padding: 14px 16px; border-radius: 20px; background: #F5FAFE; font-size: 16px; line-height: 1.5">« {{ms.brief}} »</p>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ms.criteria}}" as="cr" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700"><span style="width: 22px; height: 22px; flex: 0 0 22px; border-radius: 11px; background: #5BB8F5; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E3A57" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{cr.t}}</span>
</sc-for>
</div>
<button class="tap" type="button" onClick="{{ms.learn}}" style="margin-top: 14px; width: 100%; padding: 12px 14px; border: 1.5px solid #CFE8FA; border-radius: 20px; background: #FFFFFF; font-family: inherit; color: #0E3A57; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E3A57" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6c3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0zM12 6c3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0z"></path></svg><span style="flex: 1; font-size: 14px; font-weight: 700">Tu ne sais pas faire ? Formation « {{ms.formation}} »</span><span style="font-size: 18px; font-weight: 800">›</span></button>
<label style="margin-top: 14px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; border-radius: 24px; border: 2px dashed #A9D9F9; background: #F5FAFE; cursor: pointer; overflow: hidden">
<input type="file" accept="image/*" onChange="{{ms.pick}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer">
<sc-if value="{{ms.hasPreview}}" hint-placeholder-val="{{ false }}"><img src="{{ms.preview}}" alt="Ta création" style="display: block; width: 100%; max-height: 260px; object-fit: contain; background: #FFFFFF"></sc-if>
<sc-if value="{{ms.noPreview}}" hint-placeholder-val="{{ true }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5BB8F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
<span style="font-size: 15px; font-weight: 800">Envoie ta création</span>
<span style="font-size: 13px; color: #4F7590">Capture d’écran ou photo</span>
</sc-if>
</label>
<sc-if value="{{ms.hasErr}}" hint-placeholder-val="{{ false }}"><p style="margin: 10px 0 0; font-size: 14px; font-weight: 700; color: #B4232A; text-align: center">{{ms.err}}</p></sc-if>
<sc-if value="{{ms.showValidate}}" hint-placeholder-val="{{ true }}">
<button class="tap" type="button" onClick="{{ms.validate}}" style="margin-top: 14px; {{ms.validateStyle}}">Faire valider par l’IA</button>
</sc-if>
<sc-if value="{{ms.busy}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800"><span class="spinner"></span>L’IA analyse ta création…</div></sc-if>
</sc-if>
</sc-if>
<sc-if value="{{ms.hasResult}}" hint-placeholder-val="{{ false }}">
<div class="card" style="margin-top: 18px; padding: 18px; border-radius: 26px; border: 1.5px solid #CFE8FA; display: flex; flex-direction: column; align-items: center; text-align: center">
<span style="{{ms.ringStyle}}"><span style="width: 96px; height: 96px; border-radius: 48px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 34px; font-weight: 800; line-height: 1">{{ms.score}}</span><span style="font-size: 12px; font-weight: 800; color: #4F7590">/ 100</span></span></span>
<p style="margin: 12px 0 0; font-size: 16px; font-weight: 800; line-height: 1.4">{{ms.verdict}}</p>

<sc-for list="{{ms.forts}}" as="f1" hint-placeholder-count="2"><span style="font-size: 14px; line-height: 1.4">✓ {{f1.t}}</span></sc-for>
<sc-for list="{{ms.ameliorer}}" as="f2" hint-placeholder-count="2"><span style="font-size: 14px; line-height: 1.4; color: #4F7590">→ {{f2.t}}</span></sc-for>
</div>

<sc-if value="{{ms.lost}}" hint-placeholder-val="{{ false }}"><p style="margin: 14px 0 0; font-size: 14px; font-weight: 700; color: #4F7590">Il faut 70/100. Améliore ta création et renvoie-la plus haut.</p></sc-if>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{showSheet}}" hint-placeholder-val="{{ false }}">
<div class="fade" style="position: absolute; inset: 0; background: rgba(14,58,87,0.32)"></div>
<div class="sheet noscroll" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 760px; overflow-y: auto; box-sizing: border-box; padding: 22px 20px 40px; background: #FFFFFF; border-radius: 32px 32px 0 0; display: flex; flex-direction: column">

<span style="font-size: 14px; font-weight: 800">{{sh.timer}}</span>
</div>

<sc-for list="{{sh.choices}}" as="dc" hint-placeholder-count="2">
<button class="tap" type="button" onClick="{{dc.pick}}" style="{{dc.style}}">{{dc.txt}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{sh.isBuild}}" hint-placeholder-val="{{ false }}">

<sc-for list="{{sh.slots}}" as="sl" hint-placeholder-count="3">
<div style="{{sl.style}}">{{sl.txt}}</div>
</sc-for>
</div>

<sc-for list="{{sh.blocks}}" as="bk" hint-placeholder-count="4">
<button class="tap" type="button" onClick="{{bk.pick}}" style="{{bk.style}}">{{bk.txt}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{sh.isSwipe}}" hint-placeholder-val="{{ false }}">

</sc-for>

</div>
</sc-if>

<sc-for list="{{sh.items}}" as="si" hint-placeholder-count="3">

</sc-if>

<p style="margin: 12px 0 0; min-height: 20px; font-size: 14px; font-weight: 800; text-align: center; color: #4F7590">{{sh.flash}}</p>
<p style="margin: 4px 0 0; min-height: 22px; font-size: 15px; font-weight: 800; text-align: center; line-height: 1.4">{{sh.feedback}}</p>

</div>

<sc-if value="{{showWealth}}" hint-placeholder-val="{{ false }}">

<div class="fade" onClick="{{w.close}}" style="position: absolute; inset: 0; background: rgba(14,58,87,0.35)"></div>
<div class="sheet noscroll" style="position: absolute; left: 12px; right: 12px; bottom: 24px; max-height: 720px; overflow-y: auto; padding: 22px 20px 18px; box-sizing: border-box; border-radius: 30px; background: #FFFFFF; box-shadow: 0 16px 40px rgba(14,58,87,0.25); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 20px; background: #E3F2FD; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E3A57" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 800; color: #4F7590">Ton patrimoine personnel</span><span style="display: flex; align-items: baseline; gap: 4px; line-height: 1.1"><span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">{{w.pat}}</span><span style="font-size: 22px; font-weight: 800; color: #5BB8F5">€</span></span></span></div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #0E3A57">L’argent de ta société lui appartient, pas à toi. Verse-toi des dividendes pour construire ton patrimoine, puis ouvre d’autres sociétés.</p>
<button class="tap" type="button" onClick="{{w.dividend}}" style="{{w.divStyle}}">{{w.divLabel}}</button>
<span style="margin-top: 4px; font-size: 15px; font-weight: 800">Tes sociétés</span>
<sc-for list="{{w.cos}}" as="co" hint-placeholder-count="2">
<button class="tap" type="button" onClick="{{co.pick}}" style="{{co.style}}"><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{co.name}}</span><span style="font-size: 12px; font-weight: 700; color: #4F7590">Trésorerie {{co.treas}}</span></span><span style="{{co.tagStyle}}">{{co.tag}}</span></button>
</sc-for>
<button class="tap" type="button" onClick="{{w.create}}" style="{{w.newStyle}}">{{w.newLabel}}</button>
<span style="font-size: 12px; font-weight: 700; color: #4F7590; text-align: center">{{w.bonus}}</span>
<button class="tap" type="button" onClick="{{w.close}}" style="width: 100%; height: 50px; border: none; border-radius: 25px; background: #E3F2FD; font-family: inherit; font-size: 15px; font-weight: 800; color: #0E3A57; cursor: pointer">Fermer</button>
</div>
</div>
</sc-if>
<sc-if value="{{showHack}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 90; animation: hackPulse 0.5s linear infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #FFFFFF; text-align: center; padding: 0 28px">
<div style="animation: hackShake 0.35s linear infinite; display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 20h20z" fill="rgba(255,255,255,0.15)"></path><path d="M12 10v4" stroke-linecap="round"></path><circle cx="12" cy="17" r="0.6" fill="#FFFFFF"></circle></svg>
<span style="font-size: 34px; font-weight: 800; letter-spacing: 0.04em; animation: hackBlink 0.5s linear infinite">ALERTE ROUGE</span>
<span style="font-size: 18px; font-weight: 800">Piratage en cours</span>
<span style="font-size: 28px; font-weight: 800; padding: 8px 18px; border-radius: 18px; background: rgba(0,0,0,0.25)">{{hackLoss}}</span>
</div>
</div>
</sc-if>
<sc-if value="{{showAuth}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 70">
<div class="fade" onClick="{{auth.close}}" style="position: absolute; inset: 0; background: rgba(14,58,87,0.35)"></div>
<div class="sheet noscroll authsheet" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; padding: 22px 20px 34px; border-radius: 30px 30px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">

</div>
<div role="tablist" style="padding: 4px; border-radius: 22px; background: #E3F2FD; display: grid; grid-template-columns: 1fr 1fr; gap: 4px">
<button class="tap" type="button" role="tab" onClick="{{auth.toCreate}}" style="{{auth.tabCreate}}">Créer un compte</button>
