<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ma Boîte Inovia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Le jeu d'Inovia : on clique, et chaque clic fait grandir une vraie entreprise. Une colonne téléphone. */
:root{
  --bg:#F4F2F8; --card:#FFFFFF; --soft:#EBE4F6; --line:#DED6EC;
  --ink:#260E4F; --mute:#6C5A8C; --acc:#7046DC; --acc2:#8A63F0;
  --good:#1F8A5B; --goodbg:#E3F6EC; --bad:#B4232A; --badbg:#FDECEC; --gold:#F5B400; --goldbg:#FFF4D6;
  --f:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif; color-scheme:light;
}
html.night{--bg:#0A070F; --card:#1A1326; --soft:#281E38; --line:#2A2140; --ink:#F2EEFA; --mute:#A99BC4; --acc:#8A63F0; --acc2:#A88BFF; --good:#3DD68C; --goodbg:#173F31; --bad:#FF7A7F; --badbg:#3A1A1D; --goldbg:#3A2F14; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font:inherit}
.app{max-width:430px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:11px}
.embed .app{padding-top:4px;padding-bottom:150px}
.embed .toast{top:8px}
.head{display:flex;align-items:center;gap:8px}
.co{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:800;font-size:13.5px;text-align:left}
.co .dot{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#FFFFFF;display:grid;place-items:center;font-size:12px;flex:0 0 26px}
.co .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .ch{margin-left:auto;color:var(--mute);font-size:12px}
.lvl{font-size:12px;font-weight:800;color:var(--acc);background:var(--soft);padding:7px 10px;border-radius:999px;white-space:nowrap}
.pause{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:0 0 36px}
.pause svg{width:14px;height:14px}
.pause.on{background:var(--acc)}
.month{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--mute)}
.mbtn{font-weight:800;color:var(--acc);padding:2px 0}
.mbar{flex:1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--acc2);width:0}
.cash{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cash .k{font-size:12px;font-weight:800;color:var(--mute)}
.cash .v{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .15s}
.cash .v.neg{color:var(--bad)}
.cash .v.bump{transform:scale(1.07);color:var(--good)}
.cash .side{text-align:right;font-size:12.5px;font-weight:700;color:var(--mute);line-height:1.5}
.cash .side b{color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:7px 11px;font-size:13px;font-weight:800}
.tool svg{width:16px;height:16px}
.tool small{font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.tool.new{border-color:var(--gold);animation:tnew 1.2s 3}
@keyframes tnew{50%{box-shadow:0 0 0 5px rgba(245,180,0,.25)}}
.goal{display:flex;align-items:center;gap:10px;background:var(--acc);color:#FFFFFF;border-radius:18px;padding:10px 12px 10px 14px;font-weight:700;font-size:14px;width:100%;text-align:left}
.goal small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:800}
.goal .dot{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 28px}
.goal>span:nth-child(2){flex:1;min-width:0}
.goal .go{flex:0 0 auto;font-size:12.5px;font-weight:800;background:#FFFFFF;color:#7046DC;border-radius:12px;padding:7px 10px;white-space:nowrap}
.goal .go:empty{display:none}
.goal .go.off{background:rgba(255,255,255,.22);color:#FFFFFF}
.goal.flash{animation:gflash .7s}
@keyframes gflash{30%{background:#1F8A5B;transform:scale(1.02)}}
.work{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0}
.client{font-size:13px;font-weight:700;color:var(--mute);min-height:18px;text-align:center}
.client b{color:var(--ink)}
.clicpill{background:#260E4F;color:#FFFFFF;font-weight:800;font-size:15px;padding:7px 18px;border-radius:999px;box-shadow:0 6px 14px rgba(38,14,79,.25);transition:transform .08s}
html.night .clicpill{background:#F2EEFA;color:#0A070F}
.clicpill.hit{transform:scale(1.12)}
.ringwrap{position:relative;width:260px;height:260px;touch-action:none}
svg.ring{position:absolute;inset:0;overflow:visible;pointer-events:none}
.track{fill:none;stroke:var(--soft);stroke-width:14}
.bar{fill:none;stroke:url(#gold);stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(245,180,0,.55));transition:stroke-width .12s}
.bar.pulse{stroke-width:19}
.rhead{fill:#FFFFFF;filter:drop-shadow(0 0 8px #FFD54D) drop-shadow(0 0 3px #F5B400)}
.planet{position:absolute;left:50px;top:50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#D2C2FF 0%,#9C7BFF 22%,#7046DC 55%,#4A23B8 85%,#3A1A96 100%);box-shadow:0 0 0 10px rgba(112,70,220,.08),0 0 50px 8px rgba(138,99,240,.35),inset -14px -18px 30px rgba(30,0,90,.45);transition:transform .07s ease-out;overflow:hidden;touch-action:none}
.planet::after{content:"";position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(rgba(255,255,255,.75) 1.1px,transparent 1.5px);background-size:7px 7px;-webkit-mask-image:radial-gradient(circle at 78% 40%,#000 0%,transparent 48%);mask-image:radial-gradient(circle at 78% 40%,#000 0%,transparent 48%);pointer-events:none}
.planet::before{content:"";position:absolute;left:18%;top:10%;width:40%;height:26%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);pointer-events:none}
.planet .pt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 18px;text-align:center;color:#FFFFFF;pointer-events:none}
.planet .pt b{font-size:17px;font-weight:800;line-height:1.15;text-shadow:0 2px 6px rgba(30,0,90,.55)}
.planet .pt span{font-size:15px;font-weight:800;color:#FFE38A;text-shadow:0 2px 6px rgba(30,0,90,.55)}
.planet.press{transform:scale(.93)}
.planet.wait{filter:grayscale(.6) brightness(.9)}
.planet.boom{animation:boom .35s ease-out}
@keyframes boom{35%{transform:scale(1.08)}}
.paused .planet{filter:grayscale(.7);opacity:.75}
#fx{position:absolute;left:-60px;top:-60px;width:380px;height:380px;pointer-events:none;z-index:2}
.float{position:absolute;left:50%;top:38%;pointer-events:none;font-weight:800;font-size:22px;color:var(--good);animation:fl .9s ease-out forwards;white-space:nowrap;z-index:3}
.float.small{font-size:15px;color:var(--acc)}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-80px);opacity:0}}
.nx{width:100%;max-width:300px;display:flex;flex-direction:column;gap:5px;padding:7px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.nx .r{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--mute)}
.nx .r b{color:var(--ink);font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx .r span{flex:0 0 auto;font-variant-numeric:tabular-nums}
.nx .b{height:5px;border-radius:5px;background:var(--soft);overflow:hidden}
.nx .b i{display:block;height:100%;background:linear-gradient(90deg,#F5B400,#FFD54D);border-radius:5px;transition:width .25s}
.nx.ready{border-color:#F5B400;animation:nxr 1.2s infinite}
@keyframes nxr{50%{box-shadow:0 0 0 4px rgba(245,180,0,.22)}}
.pricebar{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px;font-weight:700;font-size:14px}
.pricebar b{font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.pricebar button{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;font-weight:800;color:var(--acc)}
.auto{font-size:12.5px;font-weight:700;color:var(--mute);text-align:center}
.boost{display:inline-block;background:var(--gold);color:#3A2A00;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:6px}
.ino{display:flex;gap:10px;align-items:flex-end}
.ino svg{width:44px;height:52px;flex:0 0 44px}
.bubble{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.4}
.bubble small{display:block;font-size:11px;font-weight:800;color:var(--acc);margin-bottom:2px}
h2{margin:8px 0 0;font-size:18px;font-weight:800}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:11px 12px;text-align:left;width:100%}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:0 0 40px;font-weight:800;color:var(--acc);font-size:14px}
.item .tx{flex:1;min-width:0}
.item .n{display:block;font-weight:800;font-size:14.5px}
.item .d{display:block;font-size:12.5px;color:var(--mute);line-height:1.35;margin-top:1px}
.item .fx{display:block;font-size:12px;font-weight:800;color:var(--good);margin-top:3px}
.item .pr{flex:0 0 auto;text-align:right;font-weight:800;font-size:13px;background:var(--acc);color:#FFFFFF;border-radius:12px;padding:8px 10px;line-height:1.25}
.item .pr small{display:block;font-size:10.5px;opacity:.85}
.item.off .pr{background:var(--soft);color:var(--mute)}
.item.new{animation:pop .5s}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.02)}}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:6px 14px}
.charges .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:13.5px;font-weight:600}
.charges .row:last-child{border-bottom:0}
.charges .row b{font-variant-numeric:tabular-nums}
.cut{font-size:12px;font-weight:800;color:var(--bad);background:var(--badbg);border-radius:10px;padding:6px 9px;margin-left:8px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(38,14,79,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:430px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet .kick{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.sheet h3{margin:4px 0 10px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.sheet h4{margin:16px 0 8px;font-size:16px;font-weight:800}
.sheet p{margin:0 0 12px;font-size:15px;line-height:1.5}
.sheet .x{float:right;width:36px;height:36px;border-radius:50%;background:var(--soft);font-weight:800;font-size:16px}
.tbl{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:4px 14px;margin-bottom:12px}
.tbl .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:14px;font-weight:600}
.tbl .r:last-child{border-bottom:0}
.tbl .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .r.tot{font-size:16px;font-weight:800}
.neg{color:var(--bad)} .pos{color:var(--good)}
.learn{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45;margin-bottom:12px}
.learn b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.cta{width:100%;height:54px;border-radius:18px;background:#7046DC;color:#FFFFFF;font-weight:800;font-size:16px;box-shadow:0 5px 0 #4A2A9E}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #4A2A9E}
.cta.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;margin-top:8px}
.cta:disabled{opacity:.45}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.choice{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.choice b{display:block;font-size:15.5px}
.choice span{display:block;font-size:13px;color:var(--mute);margin-top:2px;line-height:1.4}
.choice.rec{border-color:var(--acc)}
.choice.on{border-color:var(--acc);background:var(--soft)}
.choice .tag{display:inline-block;font-size:10.5px;font-weight:800;color:#FFFFFF;background:#7046DC;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.mini{display:inline-flex;gap:6px;flex-wrap:wrap}
.mini button{font-size:12.5px;font-weight:800;padding:7px 10px;border-radius:10px;background:var(--soft);color:var(--acc)}
.mini button.pri{background:#7046DC;color:#FFFFFF}
.mini button:disabled{opacity:.4}
.field{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:16px;font-weight:700;margin-bottom:12px;-webkit-user-select:auto;user-select:auto}
.hnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.hnav button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font-size:20px;font-weight:800;color:var(--acc)}
.hnav button:disabled{opacity:.3}
.hnav span{font-weight:800;font-size:14px;color:var(--mute)}
.spark{display:flex;align-items:flex-end;gap:4px;height:54px;margin:0 0 12px;padding:0 2px}
.spark i{flex:1;min-width:4px;border-radius:4px 4px 0 0;background:var(--soft)}
.spark i.p{background:var(--acc2)}.spark i.n{background:var(--bad)}
.spark i.cur{outline:2px solid var(--gold);outline-offset:1px}
.big3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.big3 div{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.big3 small{display:block;font-size:11.5px;font-weight:800;color:var(--mute)}
.big3 b{font-size:19px;font-variant-numeric:tabular-nums}
.big3 .wide{grid-column:1/-1}
.stock .r span small{display:block;font-size:11.5px;color:var(--mute);font-weight:700}
.bulle{position:fixed;z-index:15;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9C7BFF,#7046DC 60%,#4A23B8);box-shadow:0 10px 24px rgba(74,35,184,.45),inset 0 -4px 8px rgba(30,0,90,.35);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.bulle svg{width:27px;height:27px}
.bulle .bl{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:800;color:var(--acc);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.bulle.new{animation:bnew 1.1s 4}
@keyframes bnew{50%{box-shadow:0 0 0 10px rgba(245,180,0,.35),0 10px 24px rgba(74,35,184,.45)}}
.bulle.drag{cursor:grabbing;transform:scale(1.08)}
.world{position:fixed;inset:0;z-index:40;background:#05070d;display:flex;flex-direction:column}
.world iframe{flex:1;border:0;width:100%}
.world .wbar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2}
.world .wbar{bottom:auto!important;top:calc(92px + env(safe-area-inset-top,0px))}
.world .wbar button{background:#FFFFFF;color:#260E4F;font-weight:800;font-size:14px;padding:11px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:#260E4F;color:#FFFFFF;font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;max-width:calc(100% - 32px);width:max-content;text-align:center;animation:tin .3s}
@keyframes tin{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head">
    <button type="button" class="co" id="co"><span class="dot" id="codot">T</span><span class="nm" id="conm">Toi, en freelance</span><span class="ch" id="coch"></span></button>
    <span class="lvl" id="lvl">Tu te lances</span>
    <button type="button" class="pause" id="pause" aria-label="Mettre en pause"></button>
  </div>
  <div class="month"><button type="button" class="mbtn" id="mlab">Mois 1</button><div class="mbar"><i id="mbar"></i></div><span id="mleft">60 s</span></div>
  <div class="cash">
    <div><div class="k">Trésorerie de ta boîte</div><div class="v" id="cash">0 €</div></div>
    <div class="side">Ventes ce mois<br><b id="camonth">0 €</b></div>
  </div>
  <div class="tools" id="tools" hidden>
    <button type="button" class="tool" id="tPat" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 20h18M5 20V10M10 20V6M15 20v-8M20 20V4"/></svg>Patrimoine <small id="tPatS">0 €</small></button>
  </div>
  <button type="button" class="goal" id="goal"><span class="dot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span><small>Objectif</small><span id="goalt">Fais ton premier flyer</span></span><span class="go" id="goalgo"></span></button>
  <div class="work" id="work">
    <div class="client" id="client">Client : <b>Boulangerie Martin</b></div>
    <div class="clicpill" id="clicpill">Clic</div>
    <div class="ringwrap" id="ringwrap" role="button" tabindex="0" aria-label="Clic : travailler">
      <canvas id="fx" width="760" height="760"></canvas>
      <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
        <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".5" stop-color="#F5B400"/><stop offset="1" stop-color="#FF9F1A"/></linearGradient></defs>
        <circle class="track" cx="130" cy="130" r="118"/>
        <circle class="bar" id="bar" cx="130" cy="130" r="118" stroke-dasharray="0 742" transform="rotate(-90 130 130)"/>
        <circle class="rhead" id="headDot" cx="130" cy="12" r="7"/>
      </svg>
      <div class="planet" id="planet"><span class="pt"><b id="bt1">Faire le flyer</b><span id="bt2">15 €</span></span></div>
    </div>
    <div class="nx" id="next" hidden></div>
    <div class="pricebar" id="pricebar" hidden><span id="plab">Prix</span><button type="button" id="pm" aria-label="Baisser le prix">−</button><b id="price">15 €</b><button type="button" id="pp" aria-label="Monter le prix">+</button></div>
    <div class="auto" id="auto"></div>
  </div>
  <div class="ino" id="ino"></div>
  <button type="button" class="bulle" id="bulle" aria-label="Mon monde : ta chambre"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg><span class="bl" id="bulleL">Mon monde</span></button>

let AC=null,SOUND=true;const BUF={};
function ctx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function synth(name,sr){
  const D={pop:.14,click:.09,coin:.2,cash:.62,success:.7,error:.3,level:.95}[name]||.06;
  const n=Math.floor(D*sr),out=new Float32Array(n),TAU=Math.PI*2;
  const note=(t0,f,len,amp,harm,dec)=>{const a=Math.floor(t0*sr),L=Math.floor(len*sr);let ph=0;for(let i=0;i<L&&a+i<n;i++){const t=i/sr;const env=Math.min(1,t/.004)*Math.exp(-t*dec);ph+=TAU*f/sr;out[a+i]+=amp*env*(Math.sin(ph)+harm*Math.sin(ph*2)+harm*.4*Math.sin(ph*3));}};
  if(name==='click'){let sd=17;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647*2-1;};
    const tick=(t0,amp,f1,f2)=>{const a=Math.floor(t0*sr);let p1=0,p2=0;for(let i=0;i<Math.floor(.012*sr)&&a+i<n;i++){const t=i/sr;const w=rnd();const hp=w-2*p1+p2;p2=p1;p1=w;out[a+i]+=amp*(.55*hp*Math.exp(-t*2600)+.5*Math.sin(TAU*f1*t)*Math.exp(-t*900)+.32*Math.sin(TAU*f2*t)*Math.exp(-t*1500)+.25*Math.sin(TAU*950*t)*Math.exp(-t*600));}};
    tick(0,1,3400,7800);tick(.072,.5,3900,8600);}
  else if(name==='coin'){note(0,1567.98,.07,.22,.25,38);note(.055,2093,.145,.26,.25,22);}
  else if(name==='cash'){let sd=7,prev=0;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647*2-1;};for(let i=0;i<Math.floor(.07*sr);i++){const t=i/sr;const w=rnd();const hp=w-prev;prev=w;out[i]+=.16*Math.exp(-t*45)*hp;}note(.02,1318.51,.3,.2,.2,14);note(.09,1760,.3,.2,.2,13);note(.16,2637.02,.46,.22,.15,9);}
  else if(name==='success'){[523.25,659.25,783.99,1046.5].forEach((f,k)=>note(k*.085,f,.7-k*.085,.2,.3,7+k));}
  else if(name==='level'){[523.25,659.25,783.99,1046.5,1318.51].forEach((f,k)=>note(k*.07,f,.9-k*.07,.17,.25,6+k));note(.36,2093,.5,.07,0,9);note(.42,2637.02,.45,.05,0,10);}
  else if(name==='pop'){let ph=0;for(let i=0;i<n;i++){const t=i/sr;const f=420+900*Math.exp(-t*38);ph+=TAU*f/sr;out[i]+=.5*Math.min(1,t/.002)*Math.exp(-t*34)*Math.sin(ph);}note(.004,1760,.06,.08,0,60);}
  else if(name==='error'){let ph=0;for(let i=0;i<n;i++){const t=i/sr;const f=240-70*Math.min(1,t/.2);ph+=TAU*f/sr;out[i]=.3*Math.min(1,t/.006)*Math.exp(-t*11)*(Math.sin(ph)+.25*Math.sin(ph*3));}}
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(out[i]));
  const target={pop:.55,level:.72,click:.8,coin:.6}[name]||.72;if(pk>0)for(let i=0;i<n;i++)out[i]*=target/pk;
  const fade=Math.floor(.004*sr);for(let i=0;i<fade&&i<n;i++)out[n-1-i]*=i/fade;
  return out;
}
function play(name,vol){if(!SOUND)return;try{const a=ctx();if(!BUF[name]){const d=synth(name,a.sampleRate);const b=a.createBuffer(1,d.length,a.sampleRate);b.getChannelData(0).set(d);BUF[name]=b;}const s=a.createBufferSource(),g=a.createGain();s.buffer=BUF[name];g.gain.value=vol==null?.6:vol;s.connect(g);g.connect(a.destination);s.start();}catch(e){}}

function nextClient(C){const L=SECTORS[C.sector];C.client=R(cntC(C,'societe')&&Math.random()<.5?L.big:L.cl);}
function addWork(C,n,fromClick){
  if(C.wait>0)return;
  if(C.special){C.special.p+=n;if(C.special.p>=C.special.need){const g=C.special.reward;C.special=null;earn(C,g);if(C===S){celebrate('Commande spéciale livrée : + '+fmt(g));ringDone(true);}}return;}

  while(C.job>=need-1e-9){C.job-=need;finishJob(C,fromClick);if(C.wait>0){C.job=0;break;}}

/* ---------- l'anneau doré : une barre continue qui glisse ---------- */
const RR=118,LL=2*Math.PI*RR;let shown=0,drain=0;
function ringTarget(){if(S.special)return Math.min(1,S.special.p/S.special.need);return Math.min(1,S.job/offerOf(S).c);}
function ringDone(big){drain=1;wave=1;const p=$('#planet');p.classList.remove('boom');void p.offsetWidth;p.classList.add('boom');
  for(let k=0;k<(big?24:12);k++){const a=-Math.PI/2+k/(big?24:12)*2*Math.PI;sparks(190+RR*Math.cos(a),190+RR*Math.sin(a),big?2:1,true);}}
function ringFrame(){
  let t=ringTarget();if(drain>0){drain-=.08;t=Math.max(t,drain);}
  shown+=(t-shown)*(t<shown?.3:.42);if(Math.abs(t-shown)<.0005)shown=t;
  $('#bar').setAttribute('stroke-dasharray',(shown*LL).toFixed(1)+' '+LL.toFixed(1));
  const a=-Math.PI/2+shown*2*Math.PI,h=$('#headDot');h.setAttribute('cx',(130+RR*Math.cos(a)).toFixed(1));h.setAttribute('cy',(130+RR*Math.sin(a)).toFixed(1));h.style.opacity=shown>.005?1:0;
}
/* ---------- étincelles ---------- */
const fxc=$('#fx'),fx=fxc.getContext('2d');fx.scale(2,2);const P=[];let wave=0;
function headXY(){const a=-Math.PI/2+shown*2*Math.PI;return [190+RR*Math.cos(a),190+RR*Math.sin(a)];}
function sparks(x,y,n,big){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(big?3:1.5)+Math.random()*(big?5:2.5);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,r:big?3+Math.random()*3:1.5+Math.random()*2,c:Math.random()<.6?'#FFD54D':'#FFFFFF'});}}
function fxFrame(){fx.clearRect(0,0,380,380);
  if(wave>0){fx.strokeStyle='rgba(255,213,77,'+wave+')';fx.lineWidth=Math.max(.1,6*wave);fx.beginPath();fx.arc(190,190,RR+(1-wave)*60,0,7);fx.stroke();wave-=.04;}
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.l-=.035;if(p.l<=0){P.splice(i,1);continue;}fx.globalAlpha=p.l;fx.fillStyle=p.c;fx.beginPath();fx.arc(p.x,p.y,Math.max(.1,p.r*p.l),0,7);fx.fill();}
  fx.globalAlpha=1;}

function hit(){
  if(modal)return;if(G.paused){G.paused=false;toast('C’est reparti !');}

  if(now-lastT<60&&lastN===1){if(G.month<=3)return;add=.5;lastN=2;}           // 2e doigt posé en même temps : le pas devient entier
  else if(now-lastT<150)return;                          // pas plus de 6 touches comptées par seconde
  else{add=.5;lastN=1;lastT=now;}
  const p=$('#planet');p.classList.add('press');setTimeout(()=>p.classList.remove('press'),70);
  const pl=$('#clicpill');pl.classList.add('hit');setTimeout(()=>pl.classList.remove('hit'),80);
  const b=$('#bar');b.classList.add('pulse');setTimeout(()=>b.classList.remove('pulse'),110);
  sfx.click();buzz(6);
  addWork(S,add,true);
  const [x,y]=headXY();sparks(x,y,lastN===2?8:4);
  if(lastN===2&&!G.flags.two){G.flags.two=1;toast('2 doigts : 2 fois plus vite !');}
  render();
}

/* ================= fin du mois : les bilans ================= */
function monthCompany(C){
  const L=monthlyC(C);const fixed=L.reduce((a,x)=>a+x.v,0);
  let rec=0;if(C.sector==='ia'&&C.offer>=3)rec=Math.round(C.ca*.25);
  const lateIn=C.late;C.late=0;const ca=C.ca+rec+lateIn;
  let tax=0,taxLab='';
  if(C.statut==='micro'){tax=Math.round((C.ca+rec)*.22);taxLab='Cotisations URSSAF (environ 22 %)';}
  else if(C.statut==='sasu'){const pre=ca-fixed;tax=pre>0?Math.round(.15*Math.min(pre,3542)+.25*Math.max(0,pre-3542)):0;taxLab='Impôt sur le bénéfice (15 %, puis 25 %)';}
  const profit=ca-fixed-tax;C.cash+=rec+lateIn-fixed-tax;
  const rows=[['Tes ventes',ca,'pos']];if(rec)rows.push(['dont abonnements de tes clients',rec,'pos']);if(lateIn)rows.push(['dont paiement en retard reçu',lateIn,'pos']);
  L.forEach(x=>rows.push([x.n,-x.v,'neg']));if(tax)rows.push([taxLab,-tax,'neg']);
  const isBest=C.best==null||profit>C.best;if(isBest)C.best=profit;
  C.hist.push({m:G.month,p:profit,rows:rows});if(C.hist.length>60)C.hist.shift();
  C.ca=0;
  // plafond de la micro-entreprise (environ 77 000 € de ventes par an pour un service)
  if(C.statut==='micro'&&!C.flags.plafond){const y=C.hist.slice(-12).reduce((a,h)=>a+h.rows[0][1],0);if(y>77000)C.flags.plafond=1;}
  return {profit,isBest};
}
function endMonth(){
  const m=G.month;let others=0;let res=null;
  G.cos.forEach(C=>{const r=monthCompany(C);if(C===S)res=r;else others+=r.profit;});
  const rent=immoRent();if(rent)G.perso+=rent;
  STOCKS.forEach(s=>G.pm[s[0]]=G.prices[s[0]]);
  G.month++;G.mt=0;
  if(G.month===4&&!G.flags.two4){G.flags.two4=1;setTimeout(()=>{say('Nouveau : tu peux maintenant cliquer avec 2 doigts en même temps. Ça fait avancer ta commande 2 fois plus vite !');toast('Nouveau : clique avec 2 doigts, c’est 2 fois plus rapide !');sfx.level();},400);}

  let learn='';
  if(!G.flags.bilan){G.flags.bilan=1;learn='<div class="learn"><b>Le déclic</b>Ce que tu vends (le chiffre d’affaires) n’est pas ce que tu gagnes. Ce qu’il te reste après les charges et les cotisations, c’est le bénéfice. C’est lui qui compte.</div>';}
  else if(res.profit<0)learn='<div class="learn"><b>Attention</b>Ce mois-ci, ta boîte a dépensé plus qu’elle n’a gagné. Monte ton prix, vends plus, ou résilie une charge qui ne rapporte pas.</div>';
  else if(res.isBest&&m>2)learn='<div class="learn"><b>Nouveau record</b>Ton meilleur mois jusqu’ici. Ta boîte grandit.</div>';
  if(S.flags.plafond===1){S.flags.plafond=2;learn+='<div class="learn"><b>Plafond de la micro-entreprise</b>Tu dépasses environ 77 000 € de ventes sur un an : c’est le plafond de la micro-entreprise pour un service. Il est temps de créer une société.</div>';}
  if(others)learn+='<div class="learn"><b>Tes autres sociétés</b>Elles ont fait '+fmt(others)+' de bénéfice ce mois-ci.</div>';
  if(rent)learn+='<div class="learn"><b>Tes loyers</b>Tes biens immobiliers t’ont rapporté '+fmt(rent)+' (sur ton argent perso).</div>';
  if(S.cash<0)learn+='<div class="learn" style="background:var(--badbg);color:var(--bad)"><b>Ta banque te prévient</b>Ta boîte est à découvert. Rien n’est perdu : réduis tes charges et remets ta trésorerie dans le vert.</div>';
  sfx.win();showHist(S.hist.length-1,learn,()=>{if(m===1)say('Bravo pour ton premier mois ! Tu peux maintenant régler ton prix avec − et +. Cherche le prix le plus rentable.');save();});
  unlockCheck();
}

function showHist(i,learn,after){

let last=performance.now(),saveT=0,stockT=0,rT=0;
function step(dt){
  G.mt+=dt;
  G.cos.forEach(C=>{
    if(C.boostT>0)C.boostT-=dt;if(C.panneT>0)C.panneT-=dt;if(C.wait>0)C.wait-=dt;
    C._acc=(C._acc||0)+autoRateC(C)*dt*.5;   // les équipes avancent d'un demi-pas par « clic »
    if(C._acc>=.5){const n=Math.floor(C._acc/.5)*.5;C._acc-=n;addWork(C,n,false);}
    checkOffer(C);
  });
  stockT+=dt;if(stockT>=2){stockT=0;const dm=2/MONTH;STOCKS.forEach(s=>{const z=(Math.random()+Math.random()+Math.random()-1.5)*1.4;G.prices[s[0]]=Math.max(1,G.prices[s[0]]*Math.exp(s[2]*dm+s[3]*Math.sqrt(dm)*z));});}
  if(G.mt>=MONTH)endMonth();
  if(S.total>=25&&S.statut==='aucun'&&!S.flags.askedStat){S.flags.askedStat=1;say('Tu gagnes tes premiers euros ! Mais pour vendre légalement, il faut déclarer ton activité. Touche l’objectif en haut.');}
  const st=stage(S);if(st>(S.flags.wst||1))worldUp();
}
function loop(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(!modal&&!G.paused){step(dt);if(now>nextEv){nextEv=now+40000+Math.random()*35000;event();}}
  saveT+=dt;if(saveT>3){saveT=0;save();}
  ringFrame();fxFrame();rT+=dt;if(rT>.1){rT=0;render();}
  requestAnimationFrame(loop);
}
