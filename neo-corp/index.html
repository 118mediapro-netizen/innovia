<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}

/* Layout : scène 3D plein écran ; en haut un interrupteur Ville/Intérieur et deux stats compactes ; en bas les niveaux (verrouillés au-delà du niveau atteint) et trois icônes. Thème nuit unique (choix délibéré). */
:root{
  --bg:#040814;
  --panel:rgba(10,16,34,.62);
  --line:rgba(140,170,255,.18);
  --fg:#e8eeff;
  --muted:#93a0c4;
  --cyan:#6fe3ff;
  --violet:#b583ff;
  --warm:#ffcf8a;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top{top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:center;gap:10px}
/* interrupteur façon iOS */
.viewsw{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:999px}
.viewsw span{font-size:12px;font-weight:700;color:var(--muted);transition:color .2s;cursor:pointer;user-select:none}
.viewsw span.on{color:var(--fg)}
.sw{position:relative;width:46px;height:28px;border-radius:999px;border:none;padding:0;margin:0;background:rgba(255,255,255,.18);cursor:pointer;flex:none;transition:background .25s}
.sw[aria-checked=true]{background:linear-gradient(135deg,var(--cyan),var(--violet))}
.sw .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.sw[aria-checked=true] .knob{transform:translateX(18px)}
.sw:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
/* stats compactes */
.stats{display:flex;padding:2px;border-radius:12px}
.stat{padding:5px 10px;display:flex;flex-direction:column;gap:1px}
.stat + .stat{border-left:1px solid var(--line)}
.stat span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:14px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--warm)}
/* bas */
.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--fg);padding:7px 12px;border-radius:999px;transition:opacity .6s}
.hint.gone{opacity:0;pointer-events:none}
.ctrl{width:min(520px,100%);padding:10px;display:flex;flex-direction:column;gap:8px;border-radius:16px}
.lv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);font:600 11px var(--body);cursor:pointer;min-width:0}
.chip i{font-style:normal;font-family:var(--display);font-size:11px;line-height:1;color:var(--muted)}
.chip b{font-weight:700;font-size:11px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:3px}
.chip[aria-selected=true]{background:linear-gradient(135deg,rgba(111,227,255,.2),rgba(181,131,255,.3));border-color:rgba(111,227,255,.55)}
.chip[aria-selected=true] i{color:var(--cyan)}
.chip:disabled{cursor:default;color:var(--muted);border-style:dashed;background:transparent}
.chip svg{width:13px;height:13px}
.chip.new{animation:pop 1.3s ease}
@keyframes pop{0%{transform:scale(.7);box-shadow:0 0 0 0 rgba(181,131,255,.9)}45%{transform:scale(1.1);box-shadow:0 0 0 10px rgba(181,131,255,0)}100%{transform:scale(1)}}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo{display:flex;align-items:center;gap:4px 8px;min-width:0;flex-wrap:wrap}
.link{background:none;border:none;color:var(--cyan);font:700 12px var(--body);padding:6px 0;cursor:pointer;text-align:left}
.link.dim{color:var(--muted);font-weight:600}
.tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 6px}
.icons{display:flex;gap:6px;flex:none}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:18px;height:18px}
.ib[aria-pressed=true]{color:var(--cyan);border-color:rgba(111,227,255,.5);background:rgba(111,227,255,.08)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* fiche */
.card{position:fixed;left:50%;transform:translate(-50%,8px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 172px);width:min(340px,calc(100% - 32px));padding:14px 16px}
.card.on{opacity:1;transform:translate(-50%,0)}
.card .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);font-weight:700}
.card h2{font-family:var(--display);font-size:20px;margin:4px 0 8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.card dt{color:var(--muted)}.card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
/* niveau débloqué */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-12px);opacity:0;transition:opacity .35s,transform .35s;z-index:6;padding:12px 22px;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:700}
#toast b{font-family:var(--display);font-size:24px}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;transition:opacity .8s;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--cyan)}
#loader.gone{opacity:0;pointer-events:none}
#fade{position:fixed;inset:0;background:#02040a;opacity:0;pointer-events:none;transition:opacity .28s;z-index:4}
#fade.on{opacity:1}
/* iPad / grand écran */
@media (min-width:768px){
  .top{top:calc(env(safe-area-inset-top,0px) + 20px)}
  .hud{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .viewsw{padding:8px 14px}.viewsw span{font-size:13.5px}
  .stat{padding:6px 14px}.stat b{font-size:16px}
  .bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  .ctrl{width:min(560px,100%);padding:12px}
  .chip{min-height:50px}.chip b,.chip i{font-size:12.5px}
  .hint{font-size:13.5px;padding:9px 16px}
  .card{width:340px;left:auto;right:max(24px,env(safe-area-inset-right,0px));transform:translateY(8px);bottom:auto;top:calc(env(safe-area-inset-top,0px) + 84px);padding:18px 20px}
  .card.on{transform:translateY(0)}.card h2{font-size:23px}.card dl{font-size:14px}
}
@media (min-width:1024px) and (orientation:landscape){
  .bottom{align-items:flex-start}
  .ctrl{width:460px}
  .hint{align-self:center}
}
/* mode immersif */
.imm .hud,.imm .card{opacity:0;pointer-events:none!important}
.imm .hud > *{pointer-events:none!important}
.hud,.card{transition:opacity .35s}
#exitImm{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);
  font:600 13px var(--body);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:.75;cursor:pointer}
#exitImm:hover,#exitImm:focus-visible{opacity:1}
/* intégré dans l'appli Inovia : l'appli affiche son propre bouton retour en haut à gauche */
.embed .top{top:54px;padding-left:76px}
.embed .bottom{bottom:28px}
.embed #toast{top:112px}
.embed .demo,.embed #full,.embed #exitImm{display:none!important}
.embed .row2{justify-content:flex-end}
@media (max-width:520px){.embed .top{flex-wrap:wrap;row-gap:8px;padding-left:72px}.embed .stats{margin-left:auto}.embed .card{bottom:150px}}
@media (min-width:768px){.embed .card{top:116px}}
@media (prefers-reduced-motion:reduce){.card,.hint,#loader,#fade,.hud,#toast,.sw .knob,.sw{transition:none}.chip.new{animation:none}}

<script>
(async function(){
const loader=document.getElementById('loader');
if(!window.THREE){loader.textContent='La 3D n’a pas pu se charger. Recharge la page.';return;}
try{await Promise.race([document.fonts.load('700 80px "Chakra Petch"'),new Promise(r=>setTimeout(r,1500))]);}catch(e){}

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS=[
  {name:'Garage',worth:'12 k €'},{name:'Start-up',worth:'480 k €'},{name:'Scale-up',worth:'18 M €'},
  {name:'Groupe',worth:'740 M €'},{name:'Neo Corp',worth:'2,4 Md €'}];

/* ---------- moteur ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
const dprCap=()=>Math.min(window.devicePixelRatio||1,innerWidth*innerHeight>900000?1.5:2);
renderer.setPixelRatio(dprCap());
renderer.setSize(innerWidth,innerHeight);
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040814);
scene.fog=new THREE.FogExp2(0x050a18,0.0042);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.5,900);
var VIEWS=null,curWorld=5;
function homeView(){
  const p=innerHeight>innerWidth;
  if(VIEWS&&curWorld<5){const v=VIEWS[curWorld],k=p?1.35:1;camera.position.set(v.pos[0]*k,v.pos[1]*k,v.pos[2]*k);controls.target.set(...v.tg);controls.minDistance=v.min;controls.maxDistance=v.max;return;}
  camera.position.set(p?92:78,p?118:74,p?132:96);
  controls.target.set(0,4,6);controls.minDistance=35;controls.maxDistance=260;
}
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.minDistance=35;controls.maxDistance=260;controls.maxPolarAngle=1.36;
controls.autoRotate=!reduced;controls.autoRotateSpeed=.35;controls.screenSpacePanning=false;
homeView();controls.update();

let composer=null,bloom=null,renderPass=null;
try{
  composer=new THREE.EffectComposer(renderer);
  renderPass=new THREE.RenderPass(scene,camera);composer.addPass(renderPass);
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.75,.45,.72);
  composer.addPass(bloom);
}catch(e){composer=null;}

/* ---------- lumières ---------- */
const hemiL=new THREE.HemisphereLight(0x33447a,0x1a140e,.6);scene.add(hemiL);
const moon=new THREE.DirectionalLight(0x9db0ff,.35);moon.position.set(-60,90,-40);scene.add(moon);
[[0,5,12,0xffc98a,1.3,32],[0,5,36,0xffc98a,1.1,34],[-22,5,-22,0xffc98a,.9,26],[22,5,-22,0xffc98a,.9,26],
 [-22,5,20,0xffc98a,.9,26],[22,5,20,0xffc98a,.9,26],[0,9,-5,0x5fe6ff,1.4,18],[30,5,0,0xffc98a,.7,24]]
 .forEach(([x,y,z,c,i,d])=>{const l=new THREE.PointLight(c,i,d,1.6);l.position.set(x,y,z);scene.add(l);});

/* ---------- utilitaires ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=rng(42);
const glow=(r,g,b)=>new THREE.MeshBasicMaterial({color:new THREE.Color(r,g,b)});

function facade(seed,litP,tint){
  const r=rng(seed),c1=document.createElement('canvas'),c2=document.createElement('canvas');
  c1.width=c2.width=128;c1.height=c2.height=256;
  const a=c1.getContext('2d'),b=c2.getContext('2d');
  a.fillStyle=tint;a.fillRect(0,0,128,256);b.fillStyle='#000';b.fillRect(0,0,128,256);
  const rh=256/12,warm=['#ffd49a','#ffe5b5','#ffc576','#fff0d2','#ffdba8'];
  for(let row=0;row<12;row++){
    a.fillStyle='rgba(255,255,255,.07)';a.fillRect(0,row*rh,128,2);
    const floorLit=r()<litP+.15;
    for(let col=0;col<8;col++){
      const x=col*16+2,y=row*rh+4,w=12,h=rh-7;
      a.fillStyle='#18202e';a.fillRect(x,y,w,h);
      if(floorLit&&r()<litP+.2){const c=warm[(r()*warm.length)|0];b.fillStyle=c;b.fillRect(x,y,w,h);a.fillStyle='#5d5040';a.fillRect(x,y,w,h);}
    }
  }
  const mk=c=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;};
  return{map:mk(c1),emi:mk(c2)};
}
const FAC=[facade(3,.5,'#77716a'),facade(7,.42,'#3f4d63'),facade(11,.66,'#8a8c90'),facade(19,.55,'#556274')];
function facadeMat(v,w,h){
  const map=FAC[v].map.clone(),emi=FAC[v].emi.clone();map.needsUpdate=emi.needsUpdate=true;
  map.repeat.set(w/9.6,h/36);emi.repeat.copy(map.repeat);
  return new THREE.MeshStandardMaterial({map,emissiveMap:emi,emissive:0xffffff,emissiveIntensity:1.1,roughness:.5,metalness:.35});
}
const roofMat=new THREE.MeshStandardMaterial({color:0x3b4049,roughness:.9});
const roofBits=new THREE.MeshStandardMaterial({color:0x5a606b,roughness:.8});
const redLight=glow(3,.25,.3);
const blinkers=[];

/* ---------- île ---------- */
function rrect(x0,y0,x1,y1,r){const s=new THREE.Shape();
  s.moveTo(x0+r,y0);s.lineTo(x1-r,y0);s.quadraticCurveTo(x1,y0,x1,y0+r);s.lineTo(x1,y1-r);s.quadraticCurveTo(x1,y1,x1-r,y1);
  s.lineTo(x0+r,y1);s.quadraticCurveTo(x0,y1,x0,y1-r);s.lineTo(x0,y0+r);s.quadraticCurveTo(x0,y0,x0+r,y0);return s;}
function slab(shape,depth,top,mats){const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:10});g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,mats);m.position.y=top-depth;scene.add(m);return m;}
slab(rrect(-39.5,-35.5,39.5,37.5,13),5,-.55,[new THREE.MeshStandardMaterial({color:0x6b6253,roughness:1}),new THREE.MeshStandardMaterial({color:0x2c2f35,roughness:1})]);
slab(rrect(-36,-32,36,34,10),3,0,[new THREE.MeshStandardMaterial({color:0x6e6b67,roughness:.95}),new THREE.MeshStandardMaterial({color:0x3a3d44,roughness:1})]);
// esplanade
const plaza=new THREE.Mesh(new THREE.PlaneGeometry(22,13),new THREE.MeshStandardMaterial({color:0x8d877d,roughness:.9}));
plaza.rotation.x=-Math.PI/2;plaza.position.set(0,.02,12.5);scene.add(plaza);
const prom=new THREE.Mesh(new THREE.PlaneGeometry(64,7),new THREE.MeshStandardMaterial({color:0x8a8478,roughness:.9}));
prom.rotation.x=-Math.PI/2;prom.position.set(0,.02,28);scene.add(prom);

/* ---------- routes ---------- */
const rc=document.createElement('canvas');rc.width=256;rc.height=64;const rg=rc.getContext('2d');
rg.fillStyle='#24272d';rg.fillRect(0,0,256,64);
for(let i=0;i<900;i++){rg.fillStyle=`rgba(255,255,255,${R()*.05})`;rg.fillRect(R()*256,R()*64,2,2);}
rg.fillStyle='rgba(235,228,200,.85)';for(let x=0;x<256;x+=64)rg.fillRect(x+8,30,34,4);
rg.fillStyle='rgba(235,235,235,.35)';rg.fillRect(0,4,256,2);rg.fillRect(0,58,256,2);
const roadTex=new THREE.CanvasTexture(rc);roadTex.wrapS=THREE.RepeatWrapping;roadTex.anisotropy=8;
function road(x,z,len,ang,y){const t=roadTex.clone();t.needsUpdate=true;t.repeat.set(len/16,1);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(len,4.2),new THREE.MeshStandardMaterial({map:t,roughness:.85}));
  m.rotation.set(-Math.PI/2,0,ang);m.position.set(x,y,z);scene.add(m);}
road(0,-22,48.2,0,.04);road(0,20,48.2,0,.045);road(-22,-1,46,Math.PI/2,.05);road(22,-1,46,Math.PI/2,.055);road(0,4,39.8,0,.06);

/* ---------- immeubles ---------- */
const NAMES=['Agence IA','Studio vidéo','Data center','Labo formation','Banque d’affaires','Hôtel Marina','Média Corp','Robotique','Cloud Tower','Fintech','Bureau design','Holding','Résidence','Centre R&D','Incubateur','Siège logistique','Tour Horizon','Quantum Lab','Assurances','Pôle santé'];
const BUILD=[ // x,z,w,d,h,niveau,variante
 [-14,-15,8,8,20,1,0],[14,-4,8,6,14,1,2],[-15,12,8,8,15,1,2],[15,12,8,8,10,1,0],
 [-14,-4,8,6,12,2,1],[14,-15,8,8,24,2,3],[29,4,6,7,14,2,0],[-29,-14,6,8,18,2,2],[-8,-29,7,6,16,2,0],
 [-22,-29,7,6,26,3,1],[29,-10,6,8,22,3,3],[10,-29,8,7,30,3,1],[-29,14,6,7,12,3,0],
 [-29,1,6,7,26,4,3],[29,17,6,7,18,4,2],[22,-29,6,6,20,4,0],
 [-2,-30,7,6,42,5,1],[29,-23,6,6,32,5,3],[-29,-26,5,5,24,5,2]];
const buildings=[],pickables=[];
BUILD.forEach((b,i)=>{
  const [x,z,w,d,h,lvl,v]=b,g=new THREE.Group();g.position.set(x,0,z);
  const side=facadeMat(v,(w+d)/2,h);
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,roofMat,roofMat,side,side]);body.position.y=h/2;g.add(body);
  const ac=new THREE.Mesh(new THREE.BoxGeometry(w*.35,1.1,d*.3),roofBits);ac.position.set(-w*.15,h+.55,d*.1);g.add(ac);
  if(i%3===0){const ac2=new THREE.Mesh(new THREE.BoxGeometry(w*.2,.8,d*.2),roofBits);ac2.position.set(w*.25,h+.4,-d*.2);g.add(ac2);}
  if(h>17){const l=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),redLight);l.position.set(w/2-.5,h+.3,d/2-.5);g.add(l);blinkers.push(l);}
  if(i===5||i===11){const hp=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w,d)*.36,Math.min(w,d)*.36,.12,24),new THREE.MeshStandardMaterial({color:0x2c3138}));
    hp.position.y=h+.06;g.add(hp);const ring=new THREE.Mesh(new THREE.TorusGeometry(Math.min(w,d)*.3,.07,6,32),glow(1.2,1.1,.6));ring.rotation.x=Math.PI/2;ring.position.y=h+.15;g.add(ring);}
  g.userData={info:{name:NAMES[i%NAMES.length],eye:'Immeuble',act:['Services','Tech','Finance','Formation','Médias'][i%5],lvl,rev:`+${(Math.round(h*h*lvl*1.7)).toLocaleString('fr-FR')} €/s`},lvl,target:1,flash:0,mat:side};
  scene.add(g);buildings.push(g);pickables.push(body);body.userData.owner=g;
});

/* ---------- tour Neo Corp ---------- */
const tower=new THREE.Group();tower.position.set(0,0,-9);scene.add(tower);
const podMat=facadeMat(2,14,7);
const podium=new THREE.Mesh(new THREE.BoxGeometry(14,7,14),[podMat,podMat,roofMat,roofMat,podMat,podMat]);podium.position.y=3.5;tower.add(podium);
const poolMat=glow(.25,1.05,1.5);
const pool1=new THREE.Mesh(new THREE.BoxGeometry(6.5,.3,4),poolMat);pool1.position.set(-1,7.1,4.2);tower.add(pool1);
const deck=new THREE.Mesh(new THREE.BoxGeometry(8.5,.15,5.6),new THREE.MeshStandardMaterial({color:0x8a6b4f}));deck.position.set(-1,7.02,4.2);tower.add(deck);
const shaftMat=facadeMat(1,9,40);
const shaftGeo=new THREE.BoxGeometry(9,1,9);shaftGeo.translate(0,.5,0);
const shaft=new THREE.Mesh(shaftGeo,[shaftMat,shaftMat,roofMat,roofMat,shaftMat,shaftMat]);shaft.position.y=7;tower.add(shaft);
// bande violette verticale
const sc=document.createElement('canvas');sc.width=32;sc.height=64;const sg=sc.getContext('2d');
sg.fillStyle='#000';sg.fillRect(0,0,32,64);sg.fillStyle='#c48cff';for(let y=0;y<64;y+=16)sg.fillRect(3,y+3,26,10);
const stripTex=new THREE.CanvasTexture(sc);stripTex.wrapT=THREE.RepeatWrapping;
const stripMat=new THREE.MeshBasicMaterial({map:stripTex,color:new THREE.Color(1.8,1.6,2.2)});
const stripGeo=new THREE.PlaneGeometry(1.8,1);stripGeo.translate(0,.5,0);
const strip=new THREE.Mesh(stripGeo,stripMat);strip.position.set(-2.3,7,4.52);tower.add(strip);
const crown=new THREE.Group();tower.add(crown);
const band=new THREE.Mesh(new THREE.BoxGeometry(9.5,.4,9.5),glow(1.6,.7,2.6));band.position.y=-4.6;crown.add(band);
const pool2=new THREE.Mesh(new THREE.BoxGeometry(5,.25,3.6),poolMat);pool2.position.set(.8,.15,1.6);crown.add(pool2);
const rail=new THREE.Mesh(new THREE.BoxGeometry(9.2,.5,9.2),new THREE.MeshStandardMaterial({color:0x7d8a99,transparent:true,opacity:.35,metalness:.6,roughness:.2}));rail.position.y=.25;crown.add(rail);
const top2=new THREE.Mesh(new THREE.BoxGeometry(3.4,2.4,3),roofBits);top2.position.set(-2.2,1.2,-2.3);crown.add(top2);
const ant=new THREE.Mesh(new THREE.CylinderGeometry(.08,.14,7,6),roofBits);ant.position.set(-2.2,5.9,-2.3);crown.add(ant);
const antL=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),redLight);antL.position.set(-2.2,9.5,-2.3);crown.add(antL);blinkers.push(antL);
function signTex(){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
  x.font='700 84px "Chakra Petch", "Segoe UI", sans-serif';x.textAlign='center';x.textBaseline='middle';

/* fusion des meubles statiques (moins d'appels de rendu sur iPhone) */
function mergeStatic(stat){
  if(!THREE.BufferGeometryUtils)return;stat.updateMatrixWorld(true);const buckets=new Map();
  stat.traverse(o=>{if(!o.isMesh||o.userData.keep||Array.isArray(o.material))return;
    let g=o.geometry.clone().applyMatrix4(o.matrixWorld);if(g.index)g=g.toNonIndexed();
    Object.keys(g.attributes).forEach(k=>{if(k!=='position'&&k!=='normal'&&k!=='uv')g.deleteAttribute(k);});
    if(!g.attributes.uv||!g.attributes.normal){g.dispose();return;}
    if(!buckets.has(o.material))buckets.set(o.material,{geos:[],meshes:[]});const b=buckets.get(o.material);b.geos.push(g);b.meshes.push(o);});
  buckets.forEach((b,mat)=>{let m=null;try{m=THREE.BufferGeometryUtils.mergeBufferGeometries(b.geos,false);}catch(e){m=null;}
    b.geos.forEach(g=>g.dispose());if(!m)return;
    b.meshes.forEach(o=>{o.parent.remove(o);if(!SHARED.has(o.geometry))o.geometry.dispose();});stat.add(new THREE.Mesh(m,mat));});
}

    if(a.getInfo){const i=a.getInfo();showCard(i.eye,i.name,i.rows);}
    else if(a.kind==='bot')showCard(level===5?'Agent IA · Neo':'Assistant IA',a.name,[['Modèle',a.job.replace('Basé sur ','')],['Statut',statusOf(a)],['Contrôle humain',a.control+' %']]);
    else if(a.kind==='boss')showCard('Le patron',a.name,[['Poste',a.job],['Statut',statusOf(a)],['Patrimoine',LV[unlocked-1].worth]]);
    else showCard('Employé',a.name,[['Poste',a.job],['Statut',statusOf(a)],['Rapporte',`+${a.prod.toLocaleString('fr-FR')} €/s`]]);}
  vib(12);hint.classList.add('gone');
});
/* plein écran (iPad) : vrai plein écran quand le navigateur l'accepte, sinon mode immersif qui masque l'interface */
const fullBtn=document.getElementById('full'),exitImm=document.getElementById('exitImm');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function enterImm(){document.body.classList.add('imm');exitImm.hidden=false;card.classList.remove('on');
  const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rq){try{const r=rq.call(el);if(r&&r.catch)r.catch(()=>{});}catch(e){}}
  vib(10);}
function exitImmersive(){document.body.classList.remove('imm');exitImm.hidden=true;
  if(fsEl()){const ex=document.exitFullscreen||document.webkitExitFullscreen;try{const r=ex&&ex.call(document);if(r&&r.catch)r.catch(()=>{});}catch(e){}}}
fullBtn.addEventListener('click',enterImm);
if(window.navigator.standalone||matchMedia('(display-mode: standalone)').matches){fullBtn.setAttribute('aria-label','Masquer l’interface');fullBtn.title='Masquer l’interface';}exitImm.addEventListener('click',exitImmersive);
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('imm'))exitImmersive();}));
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('imm'))exitImmersive();});
addEventListener('resize',()=>{renderer.setPixelRatio(dprCap());camera.aspect=iCam.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();iCam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
  if(composer){composer.setSize(innerWidth,innerHeight);}});

/* ---------- boucle ---------- */
const clock=new THREE.Clock();let time=0;
function islandFrame(dt){
  water.material.uniforms.t.value=time;
  buildings.forEach(b=>{const u=b.userData;b.scale.y+=(u.target-b.scale.y)*Math.min(1,dt*3.2);
    if(Math.abs(u.target-b.scale.y)<.002)b.scale.y=u.target;b.visible=b.scale.y>.01;
    if(u.flash>0){u.flash=Math.max(0,u.flash-dt*1.4);u.mat.emissiveIntensity=1.1+u.flash*1.8;}});
  towerH+=(towerTarget-towerH)*Math.min(1,dt*2.5);setTowerH(towerH);
  const on=(time%1.6)<.25;blinkers.forEach(l=>l.visible=on);
  cars.forEach(c=>{if(c.loop){c.s+=c.v*dt;const p=loopPos(c.s,c.lane);c.g.position.set(p.x,.06,p.z);c.g.rotation.y=Math.atan2(p.dx,p.dz)+(c.v<0?Math.PI:0);}
    else{c.x+=c.v*dt;if(c.x>20)c.x=-20;if(c.x<-20)c.x=20;c.g.position.set(c.x,.07,c.z);c.g.rotation.y=c.v>0?Math.PI/2:-Math.PI/2;}});
  walkers.forEach((w,i)=>{const dx=w.tx-w.x,dz=w.tz-w.z,d=Math.hypot(dx,dz);
    if(d<.3){const t=zoneP();w.tx=t[0];w.tz=t[1];}else{w.x+=dx/d*w.sp*dt;w.z+=dz/d*w.sp*dt;}
    m4.makeTranslation(w.x,.38+Math.abs(Math.sin(time*6+i))*.04,w.z);people.setMatrixAt(i,m4);});
  people.instanceMatrix.needsUpdate=true;
  boats.forEach(b=>{const s=b.g.scale.x+(b.target-b.g.scale.x)*Math.min(1,dt*3);b.g.scale.setScalar(Math.max(s,0));b.g.visible=s>.02;
    b.g.position.y=b.baseY+Math.sin(time*1.1+b.ph)*.12;b.g.rotation.z=Math.sin(time*.9+b.ph)*.03;b.g.rotation.x=Math.sin(time*.7+b.ph*2)*.02;});
  const ca=time*.07,cr=72;cruiser.position.set(Math.cos(ca)*cr,-1.15+Math.sin(time*1.4)*.08,Math.sin(ca)*cr*.9);
  cruiser.rotation.y=-ca;
  cruiserWake.forEach((w,i)=>{const a=ca-.012*(i+1);w.position.set(Math.cos(a)*cr,-.97,Math.sin(a)*cr*.9);});
  ships.forEach((s,i)=>{s.position.y=-1+Math.sin(time*.5+i)*.15;});
  bio.material.opacity=.55+Math.sin(time*1.7)*.25;
}
function cityFrame(dt){const W=worlds[curWorld];
  W.userData.grow.forEach(g=>{const u=g.userData;if(u.gd>0){u.gd-=dt;return;}if(g.scale.y<1){g.scale.y+=(1-g.scale.y)*Math.min(1,dt*4);if(1-g.scale.y<.003)g.scale.y=1;}});
  W.userData.anim.forEach(f=>f(time,dt));
  if(curWorld===5)islandFrame(dt);
  controls.update();}
function frame(){
  const dt=Math.min(clock.getDelta(),.05);time+=dt;
  if(mode==='city'){cityFrame(dt);if(composer)composer.render();else renderer.render(scene,camera);}
  else{updateAgents(time,dt);iCtl.update();if(composer)composer.render();else renderer.render(iScene,iCam);}
  requestAnimationFrame(frame);
}
function boot(){if(started)return;started=true;level=unlocked;
  setTowerH(towerH);showWorld(level);renderChips();updateStats();updateHud();
  frame();setTimeout(()=>loader.classList.add('gone'),250);}
if(EMB){setTimeout(boot,900);try{parent.postMessage({type:'neocorp-ready'},'*');}catch(e){}}else boot();
})();
</script>
